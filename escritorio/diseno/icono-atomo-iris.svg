<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <!-- Atom with Alfred's iris as the nucleus. macOS icon grid: 824 px body centred on a 1024 canvas. -->
  <defs>
    <linearGradient id="fondo" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#171b22"/>
      <stop offset="1" stop-color="#0a0c10"/>
    </linearGradient>
    <linearGradient id="orbita" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#b9c2d0"/>
      <stop offset="1" stop-color="#6c7688"/>
    </linearGradient>
  </defs>
  <rect x="100" y="100" width="824" height="824" rx="186" fill="url(#fondo)"/>
  <rect x="100.5" y="100.5" width="823" height="823" rx="185.5" fill="none" stroke="#ffffff" stroke-opacity="0.07"/>
  <g fill="none" stroke="url(#orbita)" stroke-width="13" transform="rotate(-15 512 512)">
    <ellipse cx="512" cy="512" rx="292" ry="98"/>
    <ellipse cx="512" cy="512" rx="292" ry="98" transform="rotate(60 512 512)"/>
    <ellipse cx="512" cy="512" rx="292" ry="98" transform="rotate(-60 512 512)"/>
  </g>
  <!-- one electron on the horizontal orbit, in Alfred's light blue -->
  <circle cx="0" cy="0" r="24" fill="#0d1014" transform="rotate(-15 512 512) translate(512 512) translate(251 -50)"/>
  <circle cx="0" cy="0" r="17" fill="#9fdcff" transform="rotate(-15 512 512) translate(512 512) translate(251 -50)"/>
  <circle cx="512" cy="512" r="112" fill="#0d1014"/>
  <circle cx="512" cy="512" r="96" fill="none" stroke="#7b8698" stroke-width="9"/>
  <circle cx="512" cy="512" r="62" fill="#eef2f7"/>
  <circle cx="512" cy="512" r="23" fill="#0d1014"/>
  <circle cx="531" cy="492" r="7" fill="#eef2f7" fill-opacity="0.9"/>
</svg>
